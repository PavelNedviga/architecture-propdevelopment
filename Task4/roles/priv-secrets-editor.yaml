apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: priv-secrets-editor
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get","list","watch","create","update","patch","delete"]
- apiGroups: [""]
  resources: ["pods","pods/exec","pods/log"]
  verbs: ["get","list","watch","create","delete"]