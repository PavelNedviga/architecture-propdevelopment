apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-readonly
  labels:
    app.kubernetes.io/managed-by: rbac
rules:
  # core API
  - apiGroups: [""]
    resources:
      [ "pods", "services", "endpoints", "replicationcontrollers,
        persistentvolumeclaims", "persistentvolumes,
        configmaps", "events", "nodes", "namespaces,
        resourcequotas", "limitranges", "serviceaccounts" ]
    verbs: [ "get", "list", "watch" ]
  # workloads
  - apiGroups: ["apps"]
    resources: [ "deployments", "statefulsets", "daemonsets", "replicasets" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: ["batch"]
    resources: [ "jobs", "cronjobs" ]
    verbs: [ "get", "list", "watch" ]
  # autoscaling / network / policy
  - apiGroups: ["autoscaling"]
    resources: [ "horizontalpodautoscalers" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: ["networking.k8s.io"]
    resources: [ "ingresses", "networkpolicies" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: ["policy"]
    resources: [ "poddisruptionbudgets" ]
    verbs: [ "get", "list", "watch" ]
  # RBAC & CRDs (для обзора", "без возможности изменений)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [ roles", "rolebindings", "clusterroles", "clusterrolebindings" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: [ "customresourcedefinitions" ]
    verbs: [ "get", "list", "watch" ]