apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-sales-ops
  namespace: sales-ns               # пространство имён, где действует роль
subjects:
  - kind: User
    name: dev_sales                 # учётка разработчика
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: namespace-ops-config        # Role, созданная в sales-ns
  apiGroup: rbac.authorization.k8s.io
